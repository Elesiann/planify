name: Keep Supabase Awake

on:
  schedule:
    # Free projects pause after 7 days without database activity.
    - cron: '0 12 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    name: Query Postgres through PostgREST
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Select one household row
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_ANON_KEY repository secret."
            exit 1
          fi

          # /auth/v1/health never reaches Postgres, so it does not count as activity.
          curl --fail --silent --show-error --retry 3 --retry-delay 10 \
            "${SUPABASE_URL}/rest/v1/households?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}"
